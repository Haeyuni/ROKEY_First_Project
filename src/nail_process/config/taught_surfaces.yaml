  # coater 는 6점(쌍 3개)이 아니라 아래 sequence 목록 순서 그대로 waypoint로
  # 쓴다(2026-08-26 변경) — 바퀴마다 세 번째 점만 p3/p3r/p3l로 바뀐다.
  # sequence 가 있으면 repeats/p1..pN 자동감지는 쓰지 않는다.
  coater:
    configured: true
    frame_id: base_link
    sequence: [p1, p2, p3, p4, p1, p2, p3r, p4, p1, p2, p3l, p4]
