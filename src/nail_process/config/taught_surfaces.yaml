      p3: {x_mm: 382.18, y_mm: -27.02, z_mm: 494.69, rz1_deg: 19.79, ry_deg: -179.32, rz2_deg: 19.84}
      p4: {x_mm: 383.72, y_mm: -18.80, z_mm: 492.36, rz1_deg: 15.79, ry_deg: -179.05, rz2_deg: 15.60}
