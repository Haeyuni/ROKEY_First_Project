# ============================================================================
# 작업대 기하 — "손톱이 어디에 있고 얼마나 큰가"의 유일한 출처
# ============================================================================
#
# ● 이 파일이 하는 일 (두 가지)
#
#   ① `frames:`      → launch 가 항목 하나당 `static_transform_publisher` 를
#                       하나씩 띄운다. 그러면 ROS 전체가 "nail_local_frame 은
#                       base_link 에서 얼마나 떨어져 있다" 를 알게 된다.
#   ② `nail_region:` → launch 가 이 값을 **공정 노드들의 파라미터로 주입**한다
#                       (nail_size_x_mm / nail_size_y_mm / nail_boundary_points).
#                       각 노드는 이걸로 손톱 경계 타원을 만든다
#                       (`nail_perception.geometry2d.nail_boundary_polygon`).
#
# ● 왜 설정 파일이 경계를 정하나 (v0.3 변경 ★)
#   예전에는 scan_node 가 탐침으로 손톱/피부 강성을 재서 경계를 "측정"했다.
#   그 노드(와 inspection_node)는 폐지됐다 — 이제 경계는 측정 결과가 아니라
#   **사람이 티칭해 여기 적어둔 값**이다. 즉 이 파일이 틀리면 연마·도포·경화가
#   전부 엉뚱한 자리를 작업한다. 다른 안전장치가 이 값을 검증해 주지 않는다.
#
# ● 지금의 가계도
#
#     base_link              로봇 바닥. 모든 것의 기준점 (0,0,0)
#        │
#        ├── nail_local_frame  손톱 표면 중심 (z=0 이 표면)
#        │
#        └── tool_rack_frame   툴 랙이 어디 있나 (※ 현재 사용처 없음 — 아래 참고)
#
# ● 없으면 뭐가 깨지나
#   nail_local_frame 이 핵심이다. sanding/brushing/coating/curing/stone 이
#   하위 스킬(ContactPath/LateralContact/MoveTo/PickPlace)을 부를 때 쓰는
#   frame_id 가 전부 이 이름이다. `frames` 토큰 없이 띄우면 그 공정들이
#   전부 TF lookup 실패로 ABORT 된다.
#
# ============================================================================
# 필드 쓰는 법
# ============================================================================
#
#   parent_frame       : 누구를 기준으로 한 위치인가 (부모 프레임 이름)
#   x_mm / y_mm / z_mm : 부모로부터 얼마나 떨어져 있나 (mm)
#   + 회전값 3개 → 아래 두 방식 중 **하나만** 골라 쓴다
#
# ⚠️ 회전값 두 종류를 절대 섞지 말 것. 숫자가 셋이라 똑같아 보이지만 계산
#    방식이 완전히 다르다. 잘못 넣으면 위치는 맞는데 로봇 자세가 엉뚱해진다.
#
#   ① rz1_deg / ry_deg / rz2_deg
#      = 티치펜던트 TASK 화면의 A, B, C 를 **변환 없이 그대로** 복사
#      → 로봇을 실제로 그 자리에 가져다 놓고 화면 숫자를 읽어 넣을 때 사용
#
#   ② roll_deg / pitch_deg / yaw_deg
#      = 일반적인 tf2 회전 표기 (고정축 RPY)
#      → 로봇으로 재는 게 아니라 도면 보고 손으로 계산해 넣을 때 사용
#      ⚠️ 여기에 펜던트 A,B,C 를 넣으면 안 된다
#
#   absolute: true  (선택 필드)
#      평소엔 x/y/z 를 "부모 기준 상대 거리"로 읽는다. 이 줄을 추가하면
#      "base_link 기준 절대 좌표"로 읽는다 — 펜던트를 TASK-BASE 로 놓고 읽은
#      값을 뺄셈 없이 그대로 붙여넣고 싶을 때 쓴다. 부모 기준 상대값 환산은
#      launch(`_static_frame_nodes`)가 알아서 한다.
#
# ============================================================================

frames:
  # 툴 랙 전체의 기준 위치 (펜던트 실측값).
  #
  # ※ 현재 이 프레임을 쓰는 곳은 없다. 예전에는 slot_1~slot_6 을 이 프레임의
  #   자식으로 두고 tool_manager 가 슬롯 위치를 TF 로 조회했지만, 지금은 툴
  #   위치를 nail_skill/config/targets.yaml 에 직접 티칭해서 쓴다.
  #   실측값이라 지우지 않고 남겨둔다 — 나중에 "랙을 통째로 옮기면 슬롯 6개가
  #   같이 따라오는" 방식으로 되돌릴 때 이 값이 출발점이 된다.
  tool_rack_frame:
    parent_frame: base_link
    x_mm: 366.08
    y_mm: 5.38
    z_mm: 424.85
    rz1_deg: 67.80    # A (펜던트 TASK 화면 값 그대로)
    ry_deg: -179.90   # B
    rz2_deg: 67.88    # C

  # ▼▼▼ 손톱 표면 중심 — 이 워크스페이스에서 가장 중요한 좌표 ▼▼▼
  #
  # 원점이 손톱 한가운데, **z=0 이 손톱 표면**이다. +Z 는 표면에서 멀어지는
  # 방향(위)이고, 이 규약 위에서 각 공정이 z 를 해석한다:
  #   · coating/brushing : z=0 (표면에 접촉)
  #   · sanding          : z = work_plane_offset_mm + 패스마다 step_over_mm
  #   · curing           : z = standoff_mm (표면에서 띄운 거리)
  #   · stone            : z = target_position.z (+ approach_height_mm 로 접근)
  #
  # 축 방향 규약 (sanding 이 이걸 그대로 믿는다):
  #   +X = 큐티클 → 프리에지(손톱 끝) 방향. sanding 의 approach_side
  #        'free_edge' 가 -X, 'left' 가 +Y, 'right' 가 -Y 로 고정돼 있다.
  #   +Y = 손톱 폭 방향 (오른손 좌표계로 +Z 가 위면 자동 결정)
  #   +Z = 표면에서 멀어지는 방향
  #
  # ⚠️ roll_deg / pitch_deg 는 반드시 0 으로 둘 것. 공정 노드들이 "툴을 아래로
  #    향하게" 만드는 자세(curing_node `_FACE_DOWN_QUAT` = 로컬 X축 180°)를
  #    이 프레임이 수평이라는 전제 위에서 계산하므로, 기울이면 그만큼 툴이
  #    비스듬히 찍힌다.
  # ⚠️ yaw_deg 는 반대로 **티칭 대상**이다. 손가락이 로봇 X축과 나란하지
  #    않으면 이 값으로 손톱 길이축을 맞춰줘야 연마 방향이 맞는다 (0 이면
  #    "손톱 끝이 로봇 +X 를 향한다"는 뜻). 안착 지그가 고정이면 한 번만
  #    재면 된다.
  #
  # 아래 x/y/z 는 예전 targets.yaml 의 `stone_place`(스톤 부착 위치, 펜던트
  # get_current_posx 실측)에서 옮겨온 값이다 — 이 워크스페이스에 있던
  # "손톱 표면 위 점" 중 유일하게 실측된 좌표라 출발점으로 삼았고,
  # targets.yaml 쪽 항목은 중복이라 지웠다.
  # ⚠️ 그리퍼/툴 끝이 아니라 **플랜지 기준**으로 읽은 값이고 손톱 정중앙이라는
  #    보장도 없다. 실기 투입 전에 다음 순서로 반드시 다시 티칭할 것:
  #      1) 손을 안착시킨다
  #      2) 툴을 뺀 상태로 그리퍼를 손톱 정중앙 표면에 살짝 닿게 내린다
  #      3) 펜던트 TASK-BASE 화면의 X/Y/Z 를 여기에 그대로 적는다
  #    확인: `ros2 run tf2_ros tf2_echo base_link nail_local_frame`
  nail_local_frame:
    parent_frame: base_link
    absolute: true
    x_mm: 325.55
    y_mm: -21.85
    z_mm: 394.80
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0

# ============================================================================
# 손톱 작업 영역 크기 — launch 가 공정 노드 파라미터로 주입한다
# ============================================================================
#
# nail_local_frame 원점을 중심으로 한 **타원**의 전체 길이(mm). 반지름이
# 아니라 지름(양끝 사이 전체)이다. 실제 손톱보다 1~2mm 작게 잡는 편이
# 안전하다 — 경계 밖은 곧 피부다.
#
#   size_x_mm : 프레임의 X축 방향 = 손톱 길이 (큐티클 → 프리에지)
#   size_y_mm : 프레임의 Y축 방향 = 손톱 폭
#
# 값 재는 법: 자로 두 방향을 직접 잰다. 아래는 성인 검지 기준 대략값이며,
# 실제 시술 대상 손톱으로 반드시 다시 잴 것.
#
# boundary_points 는 타원을 몇 각형으로 근사할지다. 늘리면 경로가 매끈해지고
# 줄이면 계산이 빨라진다 — 12 미만은 눈에 띄게 각져서 권장하지 않는다.
nail_region:
  size_x_mm: 16.0
  size_y_mm: 13.0
  boundary_points: 24
