# ============================================================================
# TF 트리 — "물건들이 어디 있나"를 부모-자식으로 엮은 가계도
# ============================================================================
#
# ● 이 파일이 하는 일
#   launch 가 이 파일을 읽어서, 항목 하나당 `static_transform_publisher` 라는
#   작은 프로그램을 하나씩 띄운다. 그러면 ROS 전체가 "handrest_frame 은
#   base_link 에서 얼마나 떨어져 있다" 를 알게 된다.
#   좌표를 노드에 직접 넘기는 게 아니라, TF 라는 공용 게시판에 붙여두는 것.
#
# ● 지금의 가계도
#
#     base_link                로봇 바닥. 모든 것의 기준점 (0,0,0)
#        │
#        ├── handrest_frame    손 받침대가 어디 있나
#        │      │
#        │      └── nail_frame 받침대 위 손톱이 대략 어디쯤
#        │
#        └── tool_rack_frame   툴 랙이 어디 있나 (※ 현재 사용처 없음 — 아래 참고)
#
#   왜 이렇게 엮나: 받침대를 옮기면 손톱도 같이 따라오게 하려고. handrest_frame
#   한 줄만 고치면 nail_frame 은 자동으로 딸려 온다.
#
# ● 없으면 뭐가 깨지나
#   nail_frame 이 핵심이다. scan_node 의 기본 frame_id 가 nail_frame 이고,
#   스캔·코팅·경화·검사 명령이 전부 이 프레임을 기준으로 좌표를 준다.
#   이게 없으면 §6 스캔부터 §11 검사까지 전부 "그런 프레임 없다"로 실패한다.
#
# ============================================================================
# 필드 쓰는 법
# ============================================================================
#
#   parent_frame       : 누구를 기준으로 한 위치인가 (부모 프레임 이름)
#   x_mm / y_mm / z_mm : 부모로부터 얼마나 떨어져 있나 (mm)
#   + 회전값 3개 → 아래 두 방식 중 **하나만** 골라 쓴다
#
# ⚠️ 회전값 두 종류를 절대 섞지 말 것. 숫자가 셋이라 똑같아 보이지만 계산
#    방식이 완전히 다르다. 잘못 넣으면 위치는 맞는데 로봇 자세가 엉뚱해진다.
#
#   ① rz1_deg / ry_deg / rz2_deg
#      = 티치펜던트 TASK 화면의 A, B, C 를 **변환 없이 그대로** 복사
#      → 로봇을 실제로 그 자리에 가져다 놓고 화면 숫자를 읽어 넣을 때 사용
#
#   ② roll_deg / pitch_deg / yaw_deg
#      = 일반적인 tf2 회전 표기 (고정축 RPY)
#      → 로봇으로 재는 게 아니라 도면 보고 손으로 계산해 넣을 때 사용
#      → 지금 handrest_frame / nail_frame 은 회전이 없어서(0,0,0) 신경 안 써도 됨
#      ⚠️ 여기에 펜던트 A,B,C 를 넣으면 안 된다
#
#   absolute: true  (선택 필드)
#      평소엔 x/y/z 를 "부모 기준 상대 거리"로 읽는다. 이 줄을 추가하면
#      "base_link 기준 절대 좌표"로 읽는다 — 펜던트를 TASK-BASE 로 놓고 읽은
#      값을 뺄셈 없이 그대로 붙여넣고 싶을 때 쓴다. 부모 기준 상대값 환산은
#      launch(`_static_frame_nodes`)가 알아서 한다.
#
# ⚠️ 아래 좌표는 handrest_frame / nail_frame 이 아직 전부 추정치(placeholder)다.
#    실측으로 교체하기 전에는 이 프레임 기준으로 로봇을 움직이지 말 것.
#
# ============================================================================

frames:
  # 툴 랙 전체의 기준 위치 (펜던트 실측값).
  #
  # ※ 현재 이 프레임을 쓰는 곳은 없다. 예전에는 slot_1~slot_6 을 이 프레임의
  #   자식으로 두고 tool_manager 가 슬롯 위치를 TF 로 조회했지만, 지금은 툴
  #   위치를 nail_skill/config/targets.yaml 에 직접 티칭해서 쓴다.
  #   실측값이라 지우지 않고 남겨둔다 — 나중에 "랙을 통째로 옮기면 슬롯 6개가
  #   같이 따라오는" 방식으로 되돌릴 때 이 값이 출발점이 된다.
  tool_rack_frame:
    parent_frame: base_link
    x_mm: 366.08
    y_mm: 5.38
    z_mm: 424.85
    rz1_deg: 67.80    # A (펜던트 TASK 화면 값 그대로)
    ry_deg: -179.90   # B
    rz2_deg: 67.88    # C

  # 손 받침대. 손톱 관련 좌표의 뿌리다 — 받침대를 옮기면 여기만 고치면 된다.
  # 채우는 법: 그리퍼 끝을 받침대의 기준점(예: 손가락이 닿는 모서리)에 대고
  # 펜던트 X/Y/Z 를 읽어 넣는다. 회전은 받침대가 base_link 와 나란하면 0 그대로.
  handrest_frame:
    parent_frame: base_link
    x_mm: 400.0      # TODO: 실측값으로 교체 (티칭 1점, NIS §11.4)
    y_mm: 0.0        # TODO: 실측값으로 교체
    z_mm: 0.0        # TODO: 실측값으로 교체
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0

  # 손톱이 받침대 위 어디쯤 오는지의 대략적인 추정치.
  # 정확할 필요 없다 — scan_node 가 스캔을 마치면 실제 경계를 기준으로
  # nail_local_frame 을 새로 방송해 덮어쓴다(NIS §6.1). 이 프레임은 "스캔을
  # 어디서부터 시작할지" 초기 추정용으로만 쓰인다.
  # z_mm 은 받침대 표면에서 손톱까지의 높이(손가락 두께)로 보면 된다.
  nail_frame:
    parent_frame: handrest_frame
    x_mm: 0.0        # TODO: 실측값으로 교체
    y_mm: 0.0        # TODO: 실측값으로 교체
    z_mm: 20.0       # TODO: 실측값으로 교체 (손가락 두께 추정)
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0
