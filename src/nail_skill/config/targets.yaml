# ============================================================================
# 좌표 주소록 — robot_skill_node 가 읽는다 (`_load_targets` / `_target_task_pose`)
# ============================================================================
#
# "이름 → 좌표" 표. 그 이상도 이하도 아니다.
#
#   PickPlace(target_key: 'sander')  →  여기서 'sander' 를 찾아서
#                                    →  x=502.28, y=34.55, z=281.00 으로 이동
#
# 여기에 없는 이름이 오면 robot_skill_node 는 그 이름을 TF 프레임으로 간주해
# 한 번 더 찾아보고, 그것도 없으면 E_INVALID_GOAL 로 실패한다.
#
# ROS2 파라미터 YAML 이 아니라 순수 yaml 이다 — 최상위 키가 곧 target_key.
# launch 가 이 파일의 "경로"를 targets_yaml_path 파라미터로 넘긴다.
#
# ----------------------------------------------------------------------------
# 누가 이 파일의 이름을 쓰나
# ----------------------------------------------------------------------------
#   tool_manager : tool_rack.yaml 의 slot_frame 값을 그대로 target_key 로 넘긴다.
#                  → 툴 5개(sander/brush/coater/uv/tweezers)의 키 이름이
#                    tool_rack.yaml 의 slot_frame 과 **글자 그대로 같아야** 한다.
#                    한쪽을 고치면 반드시 다른 쪽도 같이 고칠 것.
#   stone_node   : stone_pickup_frame 파라미터(기본 'stone_tray')
#   session_orchestrator : ChangeTool 직후 '<툴>_work' 와 rack_transit
#
# ----------------------------------------------------------------------------
# 필드
# ----------------------------------------------------------------------------
#   x_mm / y_mm / z_mm  : frame_id 기준 목표 위치 (mm)
#   frame_id            : 기준 TF 프레임. 보통 base_link. 비우면 goal 이 보낸 값 사용
#   rz1_deg/ry_deg/rz2_deg : 목표 자세. 티치펜던트 TASK 화면의 A/B/C 를 **변환
#                            없이 그대로** 적는다. 생략하면 TCP 기본 자세 유지.
#   via_key             : (선택) PickPlace 가 approach 로 가기 전에 먼저 들를
#                          경유점의 target_key. 여기 있는 다른 키를 그대로
#                          가리킨다 (예: rack_transit). 대각선 이동이 랙/
#                          구조물에 부딪히는 걸 막기 위한 것 — 계산으로 만든
#                          경유점은 특이점/IK 문제로 더 위험해서(실측 확인),
#                          반드시 펜던트로 직접 티칭한 좌표만 쓸 것.
#
# 값 채우는 법: 티치펜던트를 TASK-BASE 좌표계로 두고, 그리퍼를 실제 목표
# 자세로 옮긴 뒤 화면의 X/Y/Z/A/B/C 여섯 숫자를 그대로 옮겨 적는다.
#
# ⚠️ 새로 넣은 좌표는 실기에서 MoveTo(linear=true, 저속)로 먼저 근접시켜
#    눈으로 확인한 뒤 PickPlace 에 쓸 것.

rack_transit: # 랙 진입 전 경유점 - 완 (get_current_posx 실측)
  x_mm: 580.68
  y_mm: -26.99
  z_mm: 512.99
  frame_id: base_link
  rz1_deg: 144.25
  ry_deg: -178.81
  rz2_deg: 144.12

stone_tray: # 스톤 공급 트레이 - 완 (get_current_posx 실측)
  x_mm: 408.56
  y_mm: 126.22
  z_mm: 284.95
  frame_id: base_link
  rz1_deg: 30.29    # A
  ry_deg: -179.01   # B
  rz2_deg: 30.43   # C

# ※ 스톤 부착 위치(구 stone_place)는 여기서 빠졌다 — 그 실측 좌표는
#   nail_bringup/config/static_frames.yaml 의 `nail_local_frame` 으로
#   옮겨갔다. 이제 스톤 부착점은 절대 좌표가 아니라 "손톱 프레임의 원점"
#   이고, session_orchestrator 가 PlaceStone 에 (0,0,0) 으로 넘긴다.
#
# ※ 탐침(구 probe / probe_work)도 빠졌다 — ProbePoint 스킬과 scan_node /
#   inspection_node 가 폐지되어 이 툴을 집을 일이 없다.

