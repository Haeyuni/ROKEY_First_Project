# ============================================================================
# 작업대(핸드레스트/손톱) 작업 시작 자세 — 툴별
# ============================================================================
# 위 항목들은 "랙에서 툴을 집는 자세"고, 아래는 "그 툴을 들고 실제 작업을
# 시작하는 자세"다. 필드는 완전히 동일한 형식(x_mm/y_mm/z_mm/frame_id/
# rz1_deg/ry_deg/rz2_deg/via_key). 이름만 <툴>_work 로 구분한다 — target_key
# 는 문자열 매칭이라 이름 자체엔 규칙이 없지만, rack 쪽 키(예: sander)와
# 겹치면 안 되므로 접미사로 구분한다.
#
# sander_work/uv_work는 공정 전 이동점이다. brush_work/coater_work는 이전
# 단일 기준점 방식의 실측 기록으로만 남겨 두며 현재 공정에서는 사용하지 않는다.
# 브러시·코터 작업 경로는 nail_process/config/taught_surfaces.yaml의 툴별
# P1~P6를 사용한다.
#
# ⚠️ via_key: rack_transit 은 랙 쪽 경유점이라 작업대 방향에는 안 맞을 수
#    있다 — 작업대 앞에도 안전한 경유점이 필요하면 rack_transit 과 같은
#    형식으로 하나 더 티칭해서(예: workbench_transit) 여기에 연결할 것.

# ==========================================================================
# 리본 파츠 부착용 핀셋 경로 — feature/stone
# ==========================================================================
# 모든 값은 핀셋을 RG2가 실제 작업 폭으로 잡은 상태에서 TASK-BASE 화면의
# X/Y/Z/A/B/C를 그대로 입력한다. stone_node는 다음 네 Pose를 저속 MoveL로 잇는다.
#   stone_pick_approach -> stone_pick
#   stone_place_approach -> stone_place -> stone_place_approach
# 파츠 중앙 홈을 집는 stone_pick과 네일팁 압착점 stone_place의 자세를 임의로
# Z축 정렬하지 않는다. 파츠 결에 맞춘 기울어진 A/B/C를 그대로 유지한다.
# taught_stone.yaml의 configured=false 동안에는 이 0 값으로 이동하지 않는다.

