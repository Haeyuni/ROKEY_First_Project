# robot_skill_node `targets_yaml_path` 가 읽는 타겟 좌표 테이블
# (robot_skill_node.py `_load_targets()` / `_target_task_pose()` 가 그대로 읽음).
#
# tool_rack.yaml 과 마찬가지로 ROS2 파라미터 YAML(node/ros__parameters 래핑)이
# 아니라 순수 yaml 이다 — `yaml.safe_load()` 로 통째로 읽어 target_key 를
# 최상위 키로 바로 찾는다. launch 에서 이 파일 "경로"를 `targets_yaml_path`
# 파라미터로 넘긴다.
#
# **여기에 넣으면 안 되는 것**: 툴 랙 슬롯(`slot_1`~`slot_6`)은 넣지 않는다.
# `tool_manager` 는 `PickPlace.target_key` 에 `tool_rack.yaml` 의 `slot_frame`
# 값을 그대로 넘기고, `_target_task_pose()` 는 target_key 가 이 파일에
# **없을 때만** 그 값을 TF 프레임 이름으로 취급해 조회한다(§5.1/§5.2, NIS
# §11.4 "slot_* : static_transform_publisher"). 여기 slot_* 를 미리 등록해
# 버리면 나중에 실제 CAD 기반 static_transform_publisher 를 띄워도 이 파일이
# 계속 우선 적용되어(먼저 조회하므로) TF 값이 조용히 무시된다 — 디버깅하기
# 아주 어려운 종류의 버그다.
#
# **여기에 넣는 것**: TF 프레임으로 대신할 이유가 없는, 티칭/실측으로 확정하는
# 단발성 목표 위치. 지금은 stone_node 가 참조하는 `stone_tray` 하나뿐
# (§6.7, 기본 파라미터 `stone_pickup_frame: stone_tray`).
#
# 필드 (전부 robot_skill_node.py `_target_task_pose()` 가 읽는 그대로):
#   x_mm / y_mm / z_mm : frame_id 기준 목표 위치 (mm)
#   frame_id           : 기준 TF 프레임. 비우면 goal 이 보낸 frame_id 를 그대로 씀
#   rz1_deg / ry_deg / rz2_deg : 선택. 없으면 TCP 기본 자세(z축 아래 방향) 유지
#
# ⚠️ 아래 좌표는 전부 placeholder다. 실측/티칭 전에는 신뢰하지 말 것 —
# 실기에서 MoveTo(linear=true, 저속)로 근접시켜 눈으로 확인한 뒤 갱신한다.

stone_tray:
  x_mm: 667.86
  y_mm: 91.20
  z_mm: 374.23     # TODO: 실측값으로 교체
  frame_id: base_link
  rz1_deg: 32.60    # A
  ry_deg: -179.68   # B
  rz2_deg: 32.59    # C

probe:
  x_mm: 676.84
  y_mm: -77.78
  z_mm: 288.06
  frame_id: base_link
  rz1_deg: 13.69
  ry_deg:  -179.26
  rz2_deg: 13.26